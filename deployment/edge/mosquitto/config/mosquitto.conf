# Không cho kết nối ẩn danh; tài khoản + ACL từng thiết bị do Dynamic Security plugin quản lý,
# backend tạo/khoá/xoá qua topic $CONTROL/dynamic-security/v1 (ADR-06)
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
